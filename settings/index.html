<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      margin: 0;
    }

    /* Tab Header Navigation */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease-in-out;
    }
    .tab-btn:hover {
      color: #1A2980;
    }
    .tab-btn.active {
      color: #1A2980;
      border-bottom-color: #1A2980;
    }

    /* Tab Content Panes */
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .checkbox-label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .button-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }
    .btn-save {
      background-color: #1A2980;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-save:hover {
      background-color: #26D0CE;
    }
    .btn-test {
      background-color: #f4f6f9;
      color: #333;
      border: 1px solid #ccc;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-test:hover {
      background-color: #e2e8f0;
    }
    .status-card {
      background: #f4f6f9;
      border-left: 4px solid #1A2980;
      padding: 10px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .status-value {
      font-weight: bold;
    }
    #test-result {
      margin-top: 12px;
      font-weight: 600;
      font-size: 13px;
    }

    /* Logs Tab Styling */
    .log-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .btn-sm {
      background-color: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-sm:hover {
      background-color: #ddd;
    }
    .btn-danger {
      background-color: #fff0f0;
      color: #c92a2a;
      border-color: #ffc9c9;
    }
    .btn-danger:hover {
      background-color: #ffe3e3;
    }
    #log-window {
      background: #1e1e1e;
      color: #00ff66;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      padding: 12px;
      border-radius: 6px;
      height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Navigation Tab Bar -->
  <div class="tab-bar">
    <button type="button" class="tab-btn active" data-tab="pane-settings">Settings</button>
    <button type="button" class="tab-btn" data-tab="pane-logs">Live Logs</button>
  </div>

  <!-- Tab 1: Settings Pane -->
  <div id="pane-settings" class="tab-pane active">
    <div class="status-card">
      <span>Connection Status: </span>
      <span id="connection-status" class="status-value">UNKNOWN</span>
    </div>

    <form id="settings-form">
      <div class="field">
        <label for="biostar_host">BioStar 2 Host URL</label>
        <input type="text" id="biostar_host" placeholder="https://biostar.example.com" />
      </div>

      <div class="field">
        <label for="biostar_ws_uri">WebSocket URI</label>
        <input type="text" id="biostar_ws_uri" placeholder="wss://biostar.example.com/wsapi" />
      </div>

      <div class="field">
        <label for="biostar_user">API Username</label>
        <input type="text" id="biostar_user" placeholder="SVC_API" />
      </div>

      <div class="field">
        <label for="biostar_password">API Password</label>
        <input type="password" id="biostar_password" placeholder="Enter API password" />
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="biostar_reject_unauthorized" />
          Verify SSL/TLS Certificate (Uncheck for self-signed certificates)
        </label>
      </div>

      <div class="button-group">
        <button type="button" id="save-button" class="btn-save">Save Settings</button>
        <button type="button" id="test-button" class="btn-test">Test Connection</button>
      </div>

      <div id="test-result"></div>
    </form>
  </div>

  <!-- Tab 2: Live Logs Pane -->
  <div id="pane-logs" class="tab-pane">
    <div class="log-controls">
      <span>Real-Time BioStar & App Activity Log:</span>
      <div style="display: flex; gap: 8px;">
        <button type="button" id="refresh-logs-button" class="btn-sm">Refresh Logs</button>
        <button type="button" id="clear-logs-button" class="btn-sm btn-danger">Clear Logs</button>
      </div>
    </div>
    <pre id="log-window">Loading logs...</pre>
  </div>

  <script type="text/javascript" src="index.js"></script>
</body>
</html>
